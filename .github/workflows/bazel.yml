name: Windows native token diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  token-probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install fixed Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Generate isolated harness from production sources
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"])
          probe = Path(os.environ["RUNNER_TEMP"]) / "native-token-probe"
          (probe / "src").mkdir(parents=True)
          (probe / "Cargo.toml").write_text('''
          [package]
          name = "native-token-probe"
          version = "0.0.0"
          edition = "2024"
          [workspace]
          [dependencies]
          anyhow = "=1.0.103"
          tempfile = "=3.27.0"
          pretty_assertions = "=1.4.1"
          windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
          ''')
          source = root / "codex-rs/windows-sandbox-rs/src"
          wide = (source / "winutil.rs").read_text()
          start = wide.index("pub fn to_wide<")
          end = wide.index("\n}", start) + 2
          lib = "#![allow(unsafe_op_in_unsafe_fn, dead_code)]\n"
          lib += "mod winutil { use std::ffi::OsStr; use std::os::windows::ffi::OsStrExt;\n" + wide[start:end] + "\n}\n"
          for name in ("token", "token_user"):
              lib += "#[path = " + json.dumps(str(source / (name + ".rs"))) + "] mod " + name + ";\n"
          (probe / "src/lib.rs").write_text(lib)
      - name: Run native token regressions on NTFS
        shell: pwsh
        run: |
          cargo +1.95.0 test --manifest-path "$env:RUNNER_TEMP/native-token-probe/Cargo.toml" -- --nocapture
          exit $LASTEXITCODE
